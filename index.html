<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKON SHOPS — Premium Fashion Drop</title>
  <meta name="description" content="IKON SHOPS — Premium fashion e-commerce. Streetwear, ethnic wear, accessories and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=18">
  <!-- PWA Support -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7928ca">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IKON SHOPS">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
</head>
<body>

  <!-- ═══════════════════════════════════════
       ANNOUNCEMENT BAR (AJIO STYLE TICKER)
  ═══════════════════════════════════════ -->
  <div class="ticker-bar">
    <span>Use code <strong>FIRST100</strong> — Flat ₹500 OFF on orders above ₹1,499 &nbsp;·&nbsp; Free shipping on ₹999+</span>
    <span class="ticker-pill">🛍️ NEW DROPS DAILY</span>
  </div>

  <!-- ═══════════════════════════════════════
       STICKY HEADER
  ═══════════════════════════════════════ -->
  <header class="main-header">
    <div class="container nav-wrap">

      <!-- Logo -->
      <div class="logo" onclick="App.go('home')">
        STYLE<span class="logo-badge">IKON</span>
      </div>

      <!-- Search -->
      <div class="search-wrap">
        <div class="search-box">
          <!-- search icon -->
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search-inp" type="text" placeholder="Search hoodies, kurtas, sneakers…" autocomplete="off">
        </div>
        <div class="search-drop" id="search-drop"></div>
      </div>

      <!-- Desktop nav -->
      <nav class="nav-links">
        <span class="nav-link active" data-view="home">Home</span>
        <span class="nav-link" data-view="shop">Shop</span>
        <span class="nav-link" data-view="wishlist">Wishlist</span>
        <span class="nav-link" data-view="cart">Cart</span>
      </nav>

      <!-- Header actions -->
      <div class="hdr-actions">
        <!-- theme toggle -->
        <button class="icon-btn" id="theme-btn" title="Toggle theme">
          <span id="theme-ico">🌙</span>
        </button>
        <!-- wishlist -->
        <button class="icon-btn" onclick="App.go('wishlist')" title="Wishlist">
          <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span class="badge" id="wl-badge">0</span>
        </button>
        <!-- cart drawer -->
        <button class="icon-btn" id="cart-trigger" title="Shopping bag">
          <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="badge" id="cart-badge">0</span>
        </button>
        <!-- profile -->
        <button class="icon-btn" id="user-btn" title="My account">
          <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════
       MAIN CONTENT AREA (view pages injected here)
  ═══════════════════════════════════════ -->
  <main id="app" class="container" style="flex:1; padding-top:1.5rem; padding-bottom:2rem;">
    <!-- Views rendered by app.js -->
  </main>

  <!-- ═══════════════════════════════════════
       MOBILE BOTTOM NAV
  ═══════════════════════════════════════ -->
  <nav class="bottom-nav">
    <div class="bnav-item active" data-view="home">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </div>
    <div class="bnav-item" data-view="shop">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      Shop
    </div>
    <div class="bnav-item" data-view="wishlist">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      Wishlist
    </div>
    <div class="bnav-item" data-view="cart">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Bag
    </div>
    <div class="bnav-item" data-view="profile">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Me
    </div>
  </nav>

  <!-- ═══════════════════════════════════════
       TOAST CONTAINER
  ═══════════════════════════════════════ -->
  <div class="toast-wrap" id="toasts"></div>

  <!-- ═══════════════════════════════════════
       OVERLAYS, DRAWER & MODAL CONTAINERS
  ═══════════════════════════════════════ -->
  <!-- Backdrop Overlay for drawers -->
  <div class="overlay" id="drawer-overlay" onclick="App.closeCartDrawer()"></div>

  <!-- Shopping Bag Drawer -->
  <div class="drawer" id="cart-drawer">
    <div class="drawer-head">
      <span class="drawer-title">Shopping Bag</span>
      <button class="modal-close" onclick="App.closeCartDrawer()">&times;</button>
    </div>
    <div class="drawer-body" id="cart-drawer-items">
      <!-- Items dynamically loaded -->
    </div>
    <div class="drawer-foot">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; font-family:var(--ff-head); font-weight:800;">
        <span>Subtotal</span>
        <span style="color:var(--primary); font-size:1.15rem;" id="cart-drawer-subtotal">₹0</span>
      </div>
      <button class="btn btn-primary btn-blk" onclick="App.go('cart'); App.closeCartDrawer();">View Bag &amp; Checkout</button>
    </div>
  </div>

  <!-- Modal Overlay (Shared for product, checkout, login modals) -->
  <div class="modal-overlay" id="modal-overlay" onclick="App.handleModalOverlayClick(event)">
    <div class="modal-box" id="modal-box">
      <button class="modal-close" onclick="App.closeActiveModal()">&times;</button>
      <div id="modal-content">
        <!-- Injected modal contents (Product details, login, checkout forms) -->
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       SCRIPTS (loaded in order)
  ═══════════════════════════════════════ -->
  <script src="js/products.js?v=18"></script>
  <script src="js/store.js?v=18"></script>
  <script src="js/app.js?v=18"></script>
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('IKON SHOPS: Service Worker registered'))
          .catch(err => console.log('SW error:', err));
      });
    }
  </script>
</body>
</html>
